# sunrinNS.com — Apache 사이트 설정
# 배포 위치: /etc/apache2/conf-available/sunrinns.conf  (a2enconf sunrinns)

ServerName sunrinNS.com

# 라이브러리 디렉터리는 웹에서 직접 접근 금지
<Directory /var/www/html/lib>
    Require all denied
</Directory>

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    # ───────── 확장자 없는 주소 (clean URL) ─────────
    # 주소창에 .php 가 보이지 않게 한다. 두 방향 모두 처리한다.
    #   (a) 누가 /login.php 로 들어오면 /login 으로 영구 이동시키고
    #   (b) /login 요청은 내부적으로 login.php 로 매핑한다.
    RewriteEngine On

    # (a-1) /index.php 는 루트로
    RewriteCond %{THE_REQUEST} "\s/+index\.php(\?[^\s]*)?\s"
    RewriteRule ^ / [R=301,L]

    # (a-2) 그 외 .php 직접 요청 -> 확장자 없는 주소
    #       THE_REQUEST 를 보므로 아래 내부 매핑과 무한 루프가 나지 않는다.
    RewriteCond %{THE_REQUEST} "\s/+([^?\s]*?)\.php(\?[^\s]*)?\s"
    RewriteRule ^ /%1 [R=301,L,QSA]

    # (b-1) /settings/<탭> -> settings.php?tab=<탭>
    RewriteRule ^settings/([a-z]+)/?$ settings.php?tab=$1 [L,QSA]

    # (b-2) 확장자 없는 주소 -> 같은 이름의 .php (파일이 실제로 있을 때만)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{DOCUMENT_ROOT}/$1.php -f
    RewriteRule ^([^/]+?)/?$ $1.php [L,QSA]
</Directory>
